name: 构建 Android APK

# 触发方式：
#   1) 手动：Actions 页面点 "Run workflow"
#   2) 推送：main 分支有改动时自动跑
# 注：'on' 加引号是为了防止 YAML 1.1 把它误解析成布尔 true（GitHub 自身不受影响，
#     但加引号后本地用 PyYAML 校验也能得到一致结果）。
"on":
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 Capacitor 依赖
        run: npm install

      - name: 生成 Android 平台工程
        run: npx cap add android

      - name: 注入原生 TTS 源码
        run: |
          set -e
          PKG=android/app/src/main/java/cn/clinic/manage
          mkdir -p "$PKG"
          cp native-src/cn/clinic/manage/NativeTts.java     "$PKG/"
          cp native-src/cn/clinic/manage/MainActivity.java  "$PKG/"
          echo "--- 已注入的原生文件 ---"
          ls -l "$PKG"

      - name: 安装图标生成依赖（Pillow）
        run: python3 -m pip install --quiet --disable-pip-version-check Pillow

      - name: 注入应用图标（与服务端统一）
        run: |
          set -e
          # 主闸门在 Python 脚本内部：它会读取 adaptive-icon XML，把其中每一个
          # @drawable / @mipmap / @color 引用都在 res/ 下 glob 解析一遍，
          # 任何一个解析不到就 exit 2（配合 set -e 直接失败）。这是最可靠的写法，
          # 因为它不依赖任何 shell 命令语义，跨环境（GitHub / 本地 / 容器）结果一致。
          python3 tools/make-android-icons.py ICON_256.PNG android/app/src/main/res

          echo "--- 已注入的图标资源（find 仅作展示，不影响判定）---"
          find android/app/src/main/res -name "ic_launcher*" 2>/dev/null | sort || true
          echo "--- 自适应图标 XML ---"
          cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          # 下面的 shell 闸门是「双保险」，只用 POSIX 内建（test / [ ] / for），
          # 不调用 find/grep/ls/head 等外部命令。
          # ⚠️ 尤其禁止 `find ... | grep -q .`：GitHub Actions 默认 set -o pipefail，
          #    无匹配时 grep 退出码 1 会让整条管道非 0，配合 set -e 直接中断 job
          #    （表现为「闸门误报失败」，run #4 就栽在这里）。

          echo "--- 硬闸门 1：前景图必须在 drawable-<dpi>/ ---"
          # XML 引用的是 @drawable/ic_launcher_foreground；若落在 mipmap-<dpi>/，
          # AAPT2 解析不到该资源 → 自适应图标链接失败 → 桌面无图标（真实事故）。
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/drawable-$d/ic_launcher_foreground.png" \
              || { echo "缺少 drawable-$d/ic_launcher_foreground.png"; exit 1; }
          done

          echo "--- 硬闸门 2：mipmap-<dpi>/ 下不得残留前景图 ---"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f "android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png" ]; then
              echo "错误：mipmap-$d/ 下存在 ic_launcher_foreground.png，@drawable/ 会解析失败"
              exit 1
            fi
          done

          echo "--- 硬闸门 3：传统图标 5 档齐全 ---"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/mipmap-$d/ic_launcher.png" \
              || { echo "缺少 mipmap-$d/ic_launcher.png"; exit 1; }
            test -f "android/app/src/main/res/mipmap-$d/ic_launcher_round.png" \
              || { echo "缺少 mipmap-$d/ic_launcher_round.png"; exit 1; }
          done

          echo "图标资源闸门全部通过（0 处缺失 / 0 处错位）"

      - name: 补充 AndroidManifest（TTS 查询 + 权限 + 明文流量）
        run: |
          set -e
          MF=android/app/src/main/AndroidManifest.xml
          python3 tools/patch-manifest.py "$MF"
          echo "--- 补丁后核对（硬断言，缺任一项直接失败） ---"
          grep -q "android.intent.action.TTS_SERVICE" "$MF" || { echo "缺少 TTS_SERVICE 查询"; exit 1; }
          grep -q "android.permission.FOREGROUND_SERVICE" "$MF" || { echo "缺少 FOREGROUND_SERVICE"; exit 1; }
          grep -q "android.permission.INTERNET" "$MF" || { echo "缺少 INTERNET"; exit 1; }
          grep -q 'android:usesCleartextTraffic="true"' "$MF" || { echo "缺少 usesCleartextTraffic"; exit 1; }
          # 图标引用：Capacitor 模板自带，若被改丢会导致桌面无图标
          grep -q 'android:icon="@mipmap/ic_launcher"' "$MF" || { echo "缺少 android:icon"; exit 1; }
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$MF" || { echo "缺少 android:roundIcon"; exit 1; }
          grep -n "TTS_SERVICE\|FOREGROUND_SERVICE\|usesCleartextTraffic\|INTERNET\|android:icon\|roundIcon" "$MF"

      - name: 同步 Web 资源与原生代码
        run: npx cap sync android

      - name: 授予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK
        run: |
          set -e
          SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "找到 APK: $SRC"
          cp "$SRC" "门诊管理-Android.apk"
          ls -lh "门诊管理-Android.apk"

      - name: 校验产物（应用名 + 图标 + 权限）
        run: |
          set -e
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          echo "使用: $AAPT"
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK = $APK"

          echo "--- 1) 应用名（aapt2 dump badging）---"
          "$AAPT" dump badging "$APK" > /tmp/badging.txt 2>&1
          grep -a "application-label\|application:" /tmp/badging.txt || true

          echo "--- 2) 打包进 APK 的图标条目（硬断言）---"
          unzip -l "$APK" > /tmp/ziplist.txt
          grep -a "ic_launcher" /tmp/ziplist.txt || true
          # 必须有传统图标 + 自适应 XML；缺任一即失败（否则就是「无图标」包）
          grep -aq "res/mipmap-.*/ic_launcher\.png\|res/.*/ic_launcher\.png" /tmp/ziplist.txt \
            || { echo "错误：APK 内没有 ic_launcher.png"; exit 1; }
          grep -aq "ic_launcher" /tmp/ziplist.txt || { echo "错误：APK 内没有任何 ic_launcher 条目"; exit 1; }

          echo "--- 3) 资源表里能解析出图标资源（硬断言）---"
          "$AAPT" dump resources "$APK" > /tmp/res.txt 2>&1
          grep -a "ic_launcher" /tmp/res.txt | head -20 || true

          echo "--- 4) 清单里的 application icon（硬断言）---"
          if aapt2_version=$("$AAPT" version 2>/dev/null); then echo "aapt2: $aapt2_version"; fi
          grep -a "launchable-activity\|icon=" /tmp/badging.txt || true

          echo "产物校验通过"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: 门诊管理-Android-APK
          path: 门诊管理-Android.apk
          retention-days: 90
